<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Koala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#faf3e7;
    --bg-2:#f2e6d3;
    --text-main:#4a3540;
    --text-soft:#7a6360;
    --berenjena:#6d2f52;
    --rose:#c9749a;
    --gold:#c9a24a;
    --sage:#889b70;
    --sage-dark:#5c7048;
    --btn-shadow: 0 10px 28px rgba(109,47,82,.22);

    --koala-body:#a6a9ad;
    --koala-body-dark:#84878b;
    --koala-inner-ear:#e3b8c2;
    --koala-muzzle:#efe7da;
    --koala-nose:#3d3638;
    --koala-blush:#f0a8b7;

    --petal-inner:#d688a8;
    --petal-outer:#7d3258;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; }

  body{
    min-height:100svh;
    min-height:100vh;
    font-family:'Jost', sans-serif;
    color:var(--text-main);
    background: radial-gradient(circle at 50% 0%, #fffaf1 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  .stage{
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding:18vh 20px 50px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition: padding-top .6s ease;
  }

  .stage.compact{ padding-top:8vh; }

  /* ---------- loading screen ---------- */
  .loading-screen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background: radial-gradient(circle at 50% 40%, #fffaf1 0%, var(--bg-1) 55%, var(--bg-2) 100%);
    transition: opacity .6s ease;
  }

  .loading-screen.hide{
    opacity:0;
    pointer-events:none;
  }

  .spinner{
    width:52px;
    height:52px;
    border-radius:50%;
    border:4px solid rgba(109,47,82,.15);
    border-top-color:var(--berenjena);
    animation: spin .9s linear infinite;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .loading-screen p{
    font-family:'Cormorant Garamond', serif;
    font-size:1.05rem;
    color:var(--text-soft);
    margin:0;
  }

  /* ---------- language switcher ---------- */
  .lang-switch{
    position:fixed;
    top:16px;
    right:16px;
    display:flex;
    gap:6px;
    z-index:20;
    background:rgba(255,251,244,.7);
    backdrop-filter: blur(6px);
    padding:5px;
    border-radius:999px;
    box-shadow:0 4px 14px rgba(109,47,82,.10);
  }

  .lang-switch button{
    font-size:19px;
    line-height:1;
    border:none;
    background:transparent;
    padding:6px 8px;
    border-radius:999px;
    cursor:pointer;
    opacity:.55;
    transform:scale(.92);
    transition: opacity .2s ease, transform .2s ease, background .2s ease;
  }

  .lang-switch button.active{
    opacity:1;
    transform:scale(1);
    background:rgba(109,47,82,.12);
  }

  /* ---------- intro block ---------- */
  .intro-block{
    transition: margin .5s ease;
  }

  .heading{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 7vw, 2.2rem);
    margin:0 0 8px;
    color:var(--text-main);
    transition: font-size .5s ease;
  }

  .stage.compact .heading{
    font-size:clamp(1.25rem, 5.5vw, 1.6rem);
  }

  .subtext{
    font-family:'Jost', sans-serif;
    font-size:.95rem;
    color:var(--text-soft);
    margin:0 0 26px;
    min-height:1.3em;
    transition: opacity .3s ease, margin .3s ease, max-height .3s ease;
    overflow:hidden;
  }

  .subtext.gone{
    opacity:0;
    margin:0;
    max-height:0;
    min-height:0;
  }

  /* ---------- mood buttons ---------- */
  .mood-options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }

  .mood-btn{
    width:56px;
    height:56px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.7rem;
    line-height:1;
    background:rgba(255,255,255,.55);
    border:1.5px solid transparent;
    border-radius:50%;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, width .4s ease, height .4s ease, font-size .4s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .stage.compact .mood-btn{
    width:46px;
    height:46px;
    font-size:1.4rem;
  }

  .mood-btn:hover{ transform:translateY(-2px); }

  .mood-btn.selected{
    border-color:var(--rose);
    background:#fffaf3;
    transform:scale(1.1);
  }

  /* ---------- koala scene ---------- */
  .koala-scene{
    width:100%;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .7s ease, opacity .6s ease, margin-top .6s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .koala-scene.revealed{
    max-height:900px;
    opacity:1;
    margin-top:22px;
  }

  .koala-scene.leaving{
    max-height:0;
    opacity:0;
    margin-top:0;
  }

  .koala-breathe{
    width:min(66vw, 250px);
    filter: drop-shadow(0 16px 22px rgba(109,47,82,.16));
    animation: idleBreathe 4s ease-in-out infinite;
  }

  .koala-wrap{ cursor:pointer; }
  .koala-wrap.pop{ animation: popBounce .55s ease; }
  .koala-wrap.poked{ animation: wiggle .5s ease; }
  .koala-svg{ width:100%; height:auto; display:block; overflow:visible; }

  @keyframes idleBreathe{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.02); }
  }
  @keyframes popBounce{
    0%{ transform:scale(.85) rotate(0); }
    40%{ transform:scale(1.1) rotate(-3deg); }
    70%{ transform:scale(.97) rotate(2deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  @keyframes wiggle{
    0%, 100%{ transform:rotate(0); }
    20%{ transform:rotate(-8deg); }
    40%{ transform:rotate(7deg); }
    60%{ transform:rotate(-5deg); }
    80%{ transform:rotate(3deg); }
  }

  /* koala part-by-part draw-in (plays once) */
  .draw-part{
    opacity:0;
    transform:scale(.4);
    transform-box: view-box;
    transform-origin: center;
  }
  .koala-scene.drawn .draw-part{
    animation: partReveal .55s cubic-bezier(.31,1.4,.5,1) forwards;
  }
  .koala-scene.drawn .part-1{ animation-delay:0s; }
  .koala-scene.drawn .part-2{ animation-delay:.12s; }
  .koala-scene.drawn .part-3{ animation-delay:.24s; }
  .koala-scene.drawn .part-4{ animation-delay:.36s; }
  .koala-scene.drawn .part-5{ animation-delay:.48s; }
  .koala-scene.drawn .part-6{ animation-delay:.6s; }

  @keyframes partReveal{
    0%{ opacity:0; transform:scale(.4); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:scale(1); }
  }

  /* crossfade between mood faces */
  .koala-face{
    opacity:0;
    transition: opacity .45s ease;
  }
  .koala-face.active{ opacity:1; }

  @keyframes dripTear{
    0%{ transform:translateY(0); opacity:1; }
    75%{ opacity:1; }
    100%{ transform:translateY(16px); opacity:0; }
  }
  .face-sad .tear{ animation: dripTear 1.7s ease-in infinite; }

  @keyframes blinkIdle{
    0%, 88%, 100%{ transform:scaleY(1); }
    92%{ transform:scaleY(.1); }
  }
  .face-idle .eye{ animation: blinkIdle 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

  @keyframes floatZzz{
    0%{ transform:translateY(0); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:translateY(-20px); opacity:0; }
  }
  .face-sleepy .zzz{ animation: floatZzz 2.6s ease-in-out infinite; }

  @keyframes steamFlicker{
    0%, 100%{ opacity:.25; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(-4px); }
  }
  .face-angry .steam{ animation: steamFlicker 1s ease-in-out infinite; }

  @keyframes sparklePulse{
    0%, 100%{ opacity:.35; transform:scale(.75); }
    50%{ opacity:1; transform:scale(1.15); }
  }
  .face-happy .sparkle{ animation: sparklePulse 1.5s ease-in-out infinite; }

  @keyframes flushPulse{
    0%, 100%{ opacity:.45; }
    50%{ opacity:.85; }
  }
  .face-sick .flush{ animation: flushPulse 1.7s ease-in-out infinite; }

  @keyframes floatHeart{
    0%{ transform:translateY(0) scale(.7); opacity:0; }
    20%{ opacity:1; }
    100%{ transform:translateY(-22px) scale(1); opacity:0; }
  }
  .face-loved .floaty-heart{ animation: floatHeart 2.2s ease-in-out infinite; }

  /* ---------- response ---------- */
  .response{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(1.1rem, 4.4vw, 1.35rem);
    line-height:1.5;
    color:var(--berenjena);
    max-width:26ch;
    margin:22px 0 0;
    min-height:1.5em;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .response.show{ opacity:1; transform:translateY(0); }

  /* ---------- angry sub-box ---------- */
  .angry-box{
    margin-top:20px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .5s ease, opacity .4s ease, margin-top .4s ease;
  }
  .angry-box.show{
    max-height:260px;
    opacity:1;
  }

  .angry-question{
    font-family:'Cormorant Garamond', serif;
    font-size:1.1rem;
    margin:0 0 12px;
    color:var(--text-main);
  }

  .angry-buttons{ display:flex; gap:12px; justify-content:center; }

  .angry-buttons button{
    font-family:'Jost', sans-serif;
    font-size:.9rem;
    font-weight:500;
    padding:10px 24px;
    border-radius:999px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }

  #angryYes{
    border:none;
    color:#fff8f0;
    background:linear-gradient(135deg, var(--rose), var(--berenjena));
    box-shadow:var(--btn-shadow);
  }

  #angryNo{
    background:transparent;
    border:1.5px solid rgba(122,99,96,.35);
    color:var(--text-soft);
  }

  .angry-calm{
    font-family:'Cormorant Garamond', serif;
    font-size:1.1rem;
    color:var(--berenjena);
    margin:14px 0 0;
    opacity:0;
    transition: opacity .4s ease;
  }
  .angry-calm.show{ opacity:1; }

  /* ---------- lily scene ---------- */
  .lily-scene{
    width:100%;
    max-height:0;
    opacity:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition: max-height .8s ease, opacity .7s ease, margin-top .6s ease;
  }
  .lily-scene.show{
    max-height:900px;
    opacity:1;
    margin-top:10px;
  }

  .lily-wrap{
    width:min(72vw, 280px);
    filter: drop-shadow(0 18px 24px rgba(109,47,82,.16));
    position:relative;
  }

  .lily-svg{ width:100%; height:auto; display:block; overflow:visible; }

  .lily-plant{
    transform-box: view-box;
    transform-origin: 150px 392px;
  }
  .lily-scene.swaying .lily-plant{
    animation: lilySway 5.5s ease-in-out infinite;
  }
  @keyframes lilySway{
    0%{ transform:rotate(-2deg); }
    50%{ transform:rotate(2.2deg); }
    100%{ transform:rotate(-2deg); }
  }

  .petal-rotate{ transform-box:view-box; transform-origin:0 0; }
  .petal-bloom{
    transform-box:view-box;
    transform-origin:0 0;
    transform:scale(.14);
    opacity:.5;
  }
  .lily-scene.drawn .petal-bloom{
    animation: petalBloom 1.2s cubic-bezier(.31,1.4,.5,1) forwards;
  }
  .lp0 .petal-bloom{ animation-delay:0s; }
  .lp1 .petal-bloom{ animation-delay:.14s; }
  .lp2 .petal-bloom{ animation-delay:.28s; }
  .lp3 .petal-bloom{ animation-delay:.42s; }
  .lp4 .petal-bloom{ animation-delay:.56s; }

  @keyframes petalBloom{
    0%{ transform:scale(.14); opacity:.5; }
    60%{ opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  .petal-fall{ transform-box:view-box; transform-origin:0 0; cursor:pointer; }
  .petal-fall.fallen{
    animation: petalFall .8s ease-in forwards;
    pointer-events:none;
  }
  .petal-fall.regrowing{
    animation: petalRegrow .7s cubic-bezier(.31,1.4,.5,1) forwards;
  }
  @keyframes petalFall{
    0%{ transform:translate(0,0) rotate(0); opacity:1; }
    100%{ transform:translate(14px,70px) rotate(75deg); opacity:0; }
  }
  @keyframes petalRegrow{
    0%{ transform:translate(14px,70px) rotate(75deg); opacity:0; }
    100%{ transform:translate(0,0) rotate(0); opacity:1; }
  }

  .petal-label{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:15px;
    fill:var(--berenjena);
    opacity:0;
    text-anchor:middle;
    pointer-events:none;
  }
  .petal-label.pop{ animation: labelPop 1.3s ease forwards; }
  .petal-label.final{ font-size:20px; fill:#c0245a; }
  @keyframes labelPop{
    0%{ opacity:0; transform:translateY(6px); }
    20%{ opacity:1; transform:translateY(-6px); }
    80%{ opacity:1; transform:translateY(-14px); }
    100%{ opacity:0; transform:translateY(-22px); }
  }

  .heart{
    opacity:0;
    transform-box:view-box;
    transform-origin:center;
  }
  .heart.burst{ animation: heartBurst 1.4s ease forwards; }
  @keyframes heartBurst{
    0%{ opacity:0; transform:translateY(0) scale(.3); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-60px) scale(1.1); }
  }

  .lily-message{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(1.1rem, 4.4vw, 1.35rem);
    line-height:1.55;
    color:var(--berenjena);
    max-width:28ch;
    margin:22px 0 0;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .lily-message.show{ opacity:1; transform:translateY(0); }

  footer.credit{
    margin-top:34px;
    text-align:center;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--text-soft);
    opacity:.55;
  }

  @media (prefers-reduced-motion: reduce){
    .koala-breathe{ animation:none; }
    .koala-wrap.pop, .koala-wrap.poked{ animation:none; }
    .draw-part{ opacity:1; transform:scale(1); }
    .koala-scene.drawn .draw-part{ animation:none; }
    .face-idle .eye{ animation:none; }
    .face-sad .tear,
    .face-sleepy .zzz,
    .face-angry .steam,
    .face-happy .sparkle,
    .face-sick .flush,
    .face-loved .floaty-heart{ animation:none; opacity:1; }
    .lily-scene .lily-plant{ animation:none; }
    .petal-bloom{ transform:scale(1); opacity:1; }
    .lily-scene.drawn .petal-bloom{ animation:none; }
    .petal-fall.fallen, .petal-fall.regrowing{ transition:none; }
  }
</style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <p data-i18n="loading"></p>
  </div>

  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="es" title="Español">🇪🇸</button>
    <button type="button" data-lang="en" title="English">🇬🇧</button>
    <button type="button" data-lang="hu" title="Magyar">🇭🇺</button>
  </div>

  <main class="stage" id="stage">

    <div class="intro-block" id="introBlock">
      <h1 class="heading" data-i18n="heading"></h1>
      <p class="subtext" id="subtext" data-i18n="idle"></p>

      <div class="mood-options">
        <button type="button" class="mood-btn" data-mood="sad">😢</button>
        <button type="button" class="mood-btn" data-mood="happy">😊</button>
        <button type="button" class="mood-btn" data-mood="angry">😠</button>
        <button type="button" class="mood-btn" data-mood="sleepy">😴</button>
        <button type="button" class="mood-btn" data-mood="sick">🤒</button>
        <button type="button" class="mood-btn" data-mood="loved">😍</button>
      </div>
    </div>

    <div class="koala-scene" id="koalaScene">
      <div class="koala-breathe">
        <div class="koala-wrap" id="koalaWrap">
          <svg class="koala-svg" id="koalaSvg" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

            <ellipse class="draw-part part-6" cx="150" cy="290" rx="55" ry="40" fill="var(--koala-muzzle)" opacity=".9"/>
            <ellipse class="draw-part part-6" cx="150" cy="296" rx="100" ry="62" fill="var(--koala-body)"/>

            <g class="draw-part part-1">
              <circle cx="76" cy="82" r="38" fill="var(--koala-body-dark)"/>
              <circle cx="224" cy="82" r="38" fill="var(--koala-body-dark)"/>
              <ellipse cx="80" cy="86" rx="16" ry="20" fill="var(--koala-inner-ear)"/>
              <ellipse cx="220" cy="86" rx="16" ry="20" fill="var(--koala-inner-ear)"/>
            </g>

            <circle class="draw-part part-2" cx="150" cy="150" r="82" fill="var(--koala-body)"/>

            <g class="draw-part part-5">
              <ellipse cx="94" cy="182" rx="15" ry="9" fill="var(--koala-blush)" opacity=".5"/>
              <ellipse cx="206" cy="182" rx="15" ry="9" fill="var(--koala-blush)" opacity=".5"/>
            </g>

            <g class="draw-part part-3">
              <ellipse cx="150" cy="178" rx="56" ry="44" fill="var(--koala-muzzle)"/>
              <ellipse cx="150" cy="155" rx="26" ry="18" fill="var(--koala-nose)"/>
              <ellipse cx="142" cy="149" rx="5" ry="3" fill="#fff" opacity=".45"/>
            </g>

            <!-- ============ FACES (cross-fade) ============ -->

            <g class="koala-face face-idle" data-mood="idle">
              <ellipse class="eye" cx="120" cy="120" rx="7" ry="9" fill="#3d3638"/>
              <ellipse class="eye" cx="180" cy="120" rx="7" ry="9" fill="#3d3638"/>
              <ellipse cx="122" cy="117" rx="2" ry="2.4" fill="#fff" opacity=".7"/>
              <ellipse cx="182" cy="117" rx="2" ry="2.4" fill="#fff" opacity=".7"/>
              <path d="M138,178 Q150,186 162,178" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
            </g>

            <g class="koala-face face-sad" data-mood="sad">
              <path d="M108,104 Q120,96 132,106" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
              <path d="M168,106 Q180,96 192,104" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
              <ellipse cx="120" cy="122" rx="6.5" ry="8" fill="#3d3638"/>
              <ellipse cx="180" cy="122" rx="6.5" ry="8" fill="#3d3638"/>
              <path d="M138,182 Q150,172 162,182" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
              <path class="tear" d="M183,130 C188,138 188,146 183,150 C178,146 178,138 183,130 Z" fill="#7db8d9"/>
            </g>

            <g class="koala-face face-happy" data-mood="happy">
              <path d="M108,118 Q120,106 132,118" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M168,118 Q180,106 192,118" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M128,170 Q150,196 172,170" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
              <g class="sparkle"><path d="M76,150 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 Z" fill="var(--gold)"/></g>
              <g class="sparkle" style="animation-delay:.5s"><path d="M232,140 l2.5,7 l7,2.5 l-7,2.5 l-2.5,7 l-2.5,-7 l-7,-2.5 l7,-2.5 Z" fill="var(--gold)"/></g>
            </g>

            <g class="koala-face face-angry" data-mood="angry">
              <path d="M108,112 L133,102" fill="none" stroke="#3d3638" stroke-width="4" stroke-linecap="round"/>
              <path d="M192,112 L167,102" fill="none" stroke="#3d3638" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="120" cy="124" rx="6" ry="7" fill="#3d3638"/>
              <ellipse cx="180" cy="124" rx="6" ry="7" fill="#3d3638"/>
              <path d="M136,180 L164,180" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
              <g class="steam"><path d="M118,44 Q112,34 118,24" fill="none" stroke="#b96a6a" stroke-width="3" stroke-linecap="round"/></g>

(function(){
  // bump this together with version.json on every content update
  var CURRENT_VERSION = 5;

  fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(data){
      if(data && data.v && data.v !== CURRENT_VERSION){
        location.replace(location.pathname + '?_v=' + Date.now());
      }
    })
    .catch(function(){});
})();
</script>
<script>
(function(){
  "use strict";

  var translations = {
    es: {
      loading: "Cargando con amor y cariño...",
      heading: "¿Cómo se siente Koala hoy?",
      idle: "Toca un emoji y cuéntame",
      credit: "hecho con cariño",
      happy: "Ya te lo dije, no dejes que nadie te quite esa sonrisa 😄",
      angry: "Uy, esa carita me asusta un poquito 😅",
      sleepy: "Yo soy Dormir... Buenas noches... Duerme con los angelitos ❤️",
      sick: "Descansa mucho, bebe agüita y deja que te cuide un poquito. Te vas a poner mejor 🌸",
      loved: "Más vale que sea por mí, porque si no me pongo bien celoso 😏",
      sadPool: [
        "Respira hondo, esto también va a pasar 🤍",
        "Está bien no estar bien, yo sigo aquí contigo.",
        "Eres mucho más fuerte de lo que crees, confía en ti.",
        "Un mal momento no borra todas las cosas buenas que tienes.",
        "Te mando un abrazo enorme desde aquí, no estás sola."
      ],
      angryQuestion: "¿Estás molesta con tu zebra?",
      yes: "Sí",
      no: "No",
      angryCalm: "Uff, qué alivio 💛 Prometo seguir portándome bien contigo",
      lilyMessage: "Perdón, toma este Lili para que aunque estés molesta conmigo siempre recuerdes lo mucho que te quiero... Perdón...",
      lovesMe: "Me ama",
      lovesMeNot: "No me ama",
      lovesMeFinal: "¡Me ama! 💕"
    },
    en: {
      loading: "Loading with love and care...",
      heading: "How is Koala feeling today?",
      idle: "Tap an emoji and tell me",
      credit: "made with love",
      happy: "I told you so, don't let anyone take that smile away 😄",
      angry: "Uh oh, that face scares me a little 😅",
      sleepy: "I am Sleep... Good night... Sleep with the little angels ❤️",
      sick: "Rest a lot, drink plenty of water, and let me take care of you a little. You'll feel better soon 🌸",
      loved: "It better be because of me, or I'm going to get really jealous 😏",
      sadPool: [
        "Take a deep breath, this will pass too 🤍",
        "It's okay not to be okay, I'm still right here with you.",
        "You're so much stronger than you think, trust yourself.",
        "One bad moment doesn't erase all the good things you have.",
        "Sending you a huge hug from here, you're not alone."
      ],
      angryQuestion: "Are you upset with your zebra?",
      yes: "Yes",
      no: "No",
      angryCalm: "Phew, what a relief 💛 I promise to keep treating you well",
      lilyMessage: "Sorry, take this Lily so that even when you're upset with me, you'll always remember how much I love you... Sorry...",
      lovesMe: "Loves me",
      lovesMeNot: "Loves me not",
      lovesMeFinal: "Loves me! 💕"
    },
    hu: {
      loading: "Töltés szeretettel és gondoskodással...",
      heading: "Hogy érzi magát ma Koala?",
      idle: "Koppints egy emojira és mondd el",
      credit: "szeretettel készült",
      happy: "Megmondtam, ne hagyd, hogy bárki elvegye azt a mosolyt 😄",
      angry: "Hoppá, az az arc egy kicsit megijeszt 😅",
      sleepy: "Én vagyok az Álom... Jó éjt... Aludj az angyalkákkal ❤️",
      sick: "Pihenj sokat, igyál sok vizet, és hagyd, hogy egy kicsit vigyázzak rád. Hamarosan jobban leszel 🌸",
      loved: "Jobb, ha miattam van, mert különben nagyon féltékeny leszek 😏",
      sadPool: [
        "Vegyél egy mély levegőt, ez is elmúlik majd 🤍",
        "Nem baj, ha nem vagy jól, itt vagyok veled.",
        "Sokkal erősebb vagy, mint hiszed, bízz magadban.",
        "Egy rossz pillanat nem törli el a sok jó dolgot, amid van.",
        "Küldök egy hatalmas ölelést innen, nem vagy egyedül."
      ],
      angryQuestion: "Mérges vagy a zebrádra?",
      yes: "Igen",
      no: "Nem",
      angryCalm: "Ez megnyugtató 💛 Ígérem, továbbra is jól bánok majd veled",
      lilyMessage: "Bocsánat, fogadd el ezt a Lilit, hogy még ha mérges is vagy rám, mindig emlékezz rá, mennyire szeretlek... Bocsánat...",
      lovesMe: "Szeret",
      lovesMeNot: "Nem szeret",
      lovesMeFinal: "Szeret! 💕"
    }
  };

  var DEFAULT_LANG = "hu";
  var STORAGE_KEY = "sorrylili-lang";
  var currentLang = DEFAULT_LANG;
  var currentMood = null;
  var currentSadIndex = -1;
  var koalaDrawn = false;

  var subtext = document.getElementById("subtext");
  var stage = document.getElementById("stage");
  var koalaScene = document.getElementById("koalaScene");
  var responseText = document.getElementById("responseText");
  var koalaSvg = document.getElementById("koalaSvg");
  var koalaWrap = document.getElementById("koalaWrap");
  var moodBtns = document.querySelectorAll(".mood-btn");
  var angryBox = document.getElementById("angryBox");
  var angryYes = document.getElementById("angryYes");
  var angryNo = document.getElementById("angryNo");
  var angryCalm = document.getElementById("angryCalm");
  var lilyScene = document.getElementById("lilyScene");
  var lilySvg = document.getElementById("lilySvg");
  var lilyMessage = document.getElementById("lilyMessage");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function detectLang(){
    try{
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved && translations[saved]) return saved;
    }catch(e){}
    return DEFAULT_LANG;
  }

  function pickNewSadIndex(){
    var pool = translations[currentLang].sadPool;
    var idx;
    do{ idx = Math.floor(Math.random() * pool.length); }
    while(pool.length > 1 && idx === currentSadIndex);
    currentSadIndex = idx;
  }

  function renderResponse(){
    if(!currentMood) return;
    var dict = translations[currentLang];
    responseText.textContent = currentMood === "sad"
      ? dict.sadPool[currentSadIndex >= 0 ? currentSadIndex : 0]
      : dict[currentMood];
  }

  function setLang(lang){
    if(!translations[lang]) lang = "es";
    currentLang = lang;
    var dict = translations[lang];

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n");
      if(dict[key] !== undefined) el.textContent = dict[key];
    });

    document.querySelectorAll(".lang-switch button").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });

    document.documentElement.setAttribute("lang", lang);
    try{ localStorage.setItem(STORAGE_KEY, lang); }catch(e){}

    renderResponse();
  }

  document.querySelectorAll(".lang-switch button").forEach(function(btn){
    btn.addEventListener("click", function(){ setLang(btn.getAttribute("data-lang")); });
  });

  setLang(detectLang());
  koalaSvg.querySelector('[data-mood="idle"]').classList.add("active");

  // ---------- loading screen ----------
  var loadingScreen = document.getElementById("loadingScreen");
  window.setTimeout(function(){
    loadingScreen.classList.add("hide");
  }, reduceMotion ? 300 : 3400);

  // ---------- koala moods ----------
  function triggerPop(){
    if(reduceMotion) return;
    koalaWrap.classList.remove("pop");
    void koalaWrap.offsetWidth;
    koalaWrap.classList.add("pop");
  }

  moodBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      var mood = btn.dataset.mood;

      if(!koalaDrawn){
        koalaDrawn = true;
        stage.classList.add("compact");
        subtext.classList.add("gone");
        koalaScene.classList.add("revealed");
        koalaScene.classList.add("drawn");
      }

      if(mood === "sad"){ pickNewSadIndex(); }

      currentMood = mood;
      moodBtns.forEach(function(b){ b.classList.toggle("selected", b === btn); });

      document.querySelectorAll(".koala-face").forEach(function(g){
        g.classList.toggle("active", g.dataset.mood === mood);
      });

      renderResponse();
      responseText.classList.add("show");
      triggerPop();

      if(mood === "angry"){
        angryCalm.classList.remove("show");
        angryCalm.textContent = "";
        angryBox.classList.add("show");
      }else{
        angryBox.classList.remove("show");
      }
    });
  });

  koalaWrap.addEventListener("click", function(){
    if(reduceMotion) return;
    koalaWrap.classList.remove("poked");
    void koalaWrap.offsetWidth;
    koalaWrap.classList.add("poked");
  });

  angryNo.addEventListener("click", function(){
    angryCalm.textContent = translations[currentLang].angryCalm;
    angryCalm.classList.add("show");
  });

  angryYes.addEventListener("click", function(){
    document.getElementById("introBlock").style.display = "none";
    koalaScene.classList.add("leaving");
    window.setTimeout(function(){
      koalaScene.style.display = "none";
      showLily();
    }, reduceMotion ? 0 : 700);
  });

  // ---------- lily scene ----------
  var petalLovesMe = [true, false, true, false, true];
  var pickCount = 0;
  var fallenCount = 0;
  var regrowTimer = null;

  function showLily(){
    lilyScene.classList.add("show");
    window.requestAnimationFrame(function(){
      lilyScene.classList.add("drawn");
    });

    var bloomTime = reduceMotion ? 0 : 1200;
    window.setTimeout(function(){
      lilyScene.classList.add("swaying");
      lilyMessage.classList.add("show");
    }, bloomTime + 200);

    lilySvg.querySelectorAll(".petal-fall").forEach(function(p){
      p.addEventListener("click", onPetalTap);
    });
  }

  function onPetalTap(){
    var petalGroup = this;
    var idx = parseInt(petalGroup.closest("[data-petal]").dataset.petal, 10);

    if(petalGroup.classList.contains("fallen")) return;

    pickCount++;
    fallenCount++;
    var isLast = fallenCount === petalLovesMe.length;
    var loves = pickCount % 2 === 1;

    var label = document.getElementById("petalLabel" + idx);
    var dict = translations[currentLang];
    label.textContent = isLast ? dict.lovesMeFinal : (loves ? dict.lovesMe : dict.lovesMeNot);
    label.classList.toggle("final", isLast);
    label.classList.remove("pop");
    void label.offsetWidth;
    label.classList.add("pop");

    petalGroup.classList.remove("regrowing");
    void petalGroup.offsetWidth;
    petalGroup.classList.add("fallen");

    if(isLast){
      window.setTimeout(function(){
        ["heart0","heart1","heart2"].forEach(function(id, i){
          var h = document.getElementById(id);
          h.classList.remove("burst");
          void h.offsetWidth;
          window.setTimeout(function(){ h.classList.add("burst"); }, i * 120);
        });
      }, 150);

      regrowTimer = window.setTimeout(regrowPetals, 3600);
    }
  }

  function regrowPetals(){
    lilySvg.querySelectorAll(".petal-fall").forEach(function(p, i){
      window.setTimeout(function(){
        p.classList.remove("fallen");
        p.classList.remove("regrowing");
        void p.offsetWidth;
        p.classList.add("regrowing");
      }, i * 90);
    });
    lilySvg.querySelectorAll(".petal-label").forEach(function(l){
      l.classList.remove("pop", "final");
    });
    pickCount = 0;
    fallenCount = 0;
  }

})();
</script>

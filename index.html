<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Koala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#faf3e7;
    --bg-2:#f2e6d3;
    --text-main:#4a3540;
    --text-soft:#7a6360;
    --berenjena:#6d2f52;
    --rose:#c9749a;
    --sage:#889b70;
    --btn-shadow: 0 10px 28px rgba(109,47,82,.22);

    --koala-body:#a6a9ad;
    --koala-body-dark:#84878b;
    --koala-inner-ear:#e3b8c2;
    --koala-muzzle:#efe7da;
    --koala-nose:#3d3638;
    --koala-blush:#f0a8b7;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; }

  body{
    min-height:100svh;
    min-height:100vh;
    font-family:'Jost', sans-serif;
    color:var(--text-main);
    background: radial-gradient(circle at 50% 0%, #fffaf1 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .stage{
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding:76px 20px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- language switcher ---------- */
  .lang-switch{
    position:fixed;
    top:16px;
    right:16px;
    display:flex;
    gap:6px;
    z-index:20;
    background:rgba(255,251,244,.7);
    backdrop-filter: blur(6px);
    padding:5px;
    border-radius:999px;
    box-shadow:0 4px 14px rgba(109,47,82,.10);
  }

  .lang-switch button{
    font-family:'Jost', sans-serif;
    font-size:12px;
    letter-spacing:.05em;
    font-weight:500;
    border:none;
    background:transparent;
    color:var(--text-soft);
    padding:6px 11px;
    border-radius:999px;
    cursor:pointer;
    transition: background .25s ease, color .25s ease;
  }

  .lang-switch button.active{
    background:var(--berenjena);
    color:#fff8f0;
  }

  .lang-switch button:not(.active):hover{
    background:rgba(109,47,82,.10);
  }

  /* ---------- heading ---------- */
  .heading{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 7vw, 2.2rem);
    margin:0 0 8px;
    color:var(--text-main);
  }

  .subtext{
    font-family:'Jost', sans-serif;
    font-size:.95rem;
    color:var(--text-soft);
    margin:0 0 26px;
    min-height:1.3em;
  }

  /* ---------- mood buttons ---------- */
  .mood-options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:30px;
  }

  .mood-btn{
    width:56px;
    height:56px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.7rem;
    line-height:1;
    background:rgba(255,255,255,.55);
    border:1.5px solid transparent;
    border-radius:50%;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .mood-btn:hover{ transform:translateY(-2px); }

  .mood-btn.selected{
    border-color:var(--rose);
    background:#fffaf3;
    transform:scale(1.1);
  }

  /* ---------- koala ---------- */
  .koala-breathe{
    width:min(72vw, 280px);
    filter: drop-shadow(0 16px 22px rgba(109,47,82,.16));
    animation: idleBreathe 4s ease-in-out infinite;
  }

  .koala-wrap{ cursor:pointer; }

  .koala-wrap.pop{ animation: popBounce .55s ease; }
  .koala-wrap.poked{ animation: wiggle .5s ease; }

  .koala-svg{ width:100%; height:auto; display:block; overflow:visible; }

  @keyframes idleBreathe{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.02); }
  }

  @keyframes popBounce{
    0%{ transform:scale(.85) rotate(0); }
    40%{ transform:scale(1.1) rotate(-3deg); }
    70%{ transform:scale(.97) rotate(2deg); }
    100%{ transform:scale(1) rotate(0); }
  }

  @keyframes wiggle{
    0%, 100%{ transform:rotate(0); }
    20%{ transform:rotate(-8deg); }
    40%{ transform:rotate(7deg); }
    60%{ transform:rotate(-5deg); }
    80%{ transform:rotate(3deg); }
  }

  .koala-face{ display:none; }
  #koalaSvg.mood-idle .face-idle,
  #koalaSvg.mood-sad .face-sad,
  #koalaSvg.mood-happy .face-happy,
  #koalaSvg.mood-angry .face-angry,
  #koalaSvg.mood-sleepy .face-sleepy,
  #koalaSvg.mood-sick .face-sick{
    display:block;
  }

  @keyframes dripTear{
    0%{ transform:translateY(0); opacity:1; }
    75%{ opacity:1; }
    100%{ transform:translateY(16px); opacity:0; }
  }
  .face-sad .tear{ animation: dripTear 1.7s ease-in infinite; }

  @keyframes floatZzz{
    0%{ transform:translateY(0); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:translateY(-20px); opacity:0; }
  }
  .face-sleepy .zzz{ animation: floatZzz 2.6s ease-in-out infinite; }

  @keyframes steamFlicker{
    0%, 100%{ opacity:.25; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(-4px); }
  }
  .face-angry .steam{ animation: steamFlicker 1s ease-in-out infinite; }

  @keyframes sparklePulse{
    0%, 100%{ opacity:.35; transform:scale(.75); }
    50%{ opacity:1; transform:scale(1.15); }
  }
  .face-happy .sparkle{ animation: sparklePulse 1.5s ease-in-out infinite; }

  @keyframes flushPulse{
    0%, 100%{ opacity:.45; }
    50%{ opacity:.85; }
  }
  .face-sick .flush{ animation: flushPulse 1.7s ease-in-out infinite; }

  /* ---------- response ---------- */
  .response{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(1.15rem, 4.6vw, 1.4rem);
    line-height:1.5;
    color:var(--berenjena);
    max-width:26ch;
    margin:26px 0 0;
    min-height:1.6em;
  }

  footer.credit{
    margin-top:34px;
    text-align:center;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--text-soft);
    opacity:.55;
  }

  @media (prefers-reduced-motion: reduce){
    .koala-breathe{ animation:none; }
    .koala-wrap.pop, .koala-wrap.poked{ animation:none; }
    .face-sad .tear,
    .face-sleepy .zzz,
    .face-angry .steam,
    .face-happy .sparkle,
    .face-sick .flush{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="hu">HU</button>
  </div>

  <main class="stage">
    <h1 class="heading" data-i18n="heading"></h1>
    <p class="subtext" id="subtext" data-i18n="idle"></p>

    <div class="mood-options">
      <button type="button" class="mood-btn" data-mood="sad">😢</button>
      <button type="button" class="mood-btn" data-mood="happy">😊</button>
      <button type="button" class="mood-btn" data-mood="angry">😠</button>
      <button type="button" class="mood-btn" data-mood="sleepy">😴</button>
      <button type="button" class="mood-btn" data-mood="sick">🤒</button>
    </div>

    <div class="koala-breathe">
      <div class="koala-wrap" id="koalaWrap">
        <svg class="koala-svg" id="koalaSvg" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          <!-- body -->
          <ellipse cx="150" cy="290" rx="55" ry="40" fill="var(--koala-muzzle)" opacity=".9"/>
          <ellipse cx="150" cy="296" rx="100" ry="62" fill="var(--koala-body)"/>

          <!-- ears -->
          <circle cx="76" cy="82" r="38" fill="var(--koala-body-dark)"/>
          <circle cx="224" cy="82" r="38" fill="var(--koala-body-dark)"/>
          <ellipse cx="80" cy="86" rx="16" ry="20" fill="var(--koala-inner-ear)"/>
          <ellipse cx="220" cy="86" rx="16" ry="20" fill="var(--koala-inner-ear)"/>

          <!-- head -->
          <circle cx="150" cy="150" r="82" fill="var(--koala-body)"/>

          <!-- blush -->
          <ellipse cx="94" cy="182" rx="15" ry="9" fill="var(--koala-blush)" opacity=".5"/>
          <ellipse cx="206" cy="182" rx="15" ry="9" fill="var(--koala-blush)" opacity=".5"/>

          <!-- muzzle + nose -->
          <ellipse cx="150" cy="178" rx="56" ry="44" fill="var(--koala-muzzle)"/>
          <ellipse cx="150" cy="155" rx="26" ry="18" fill="var(--koala-nose)"/>
          <ellipse cx="142" cy="149" rx="5" ry="3" fill="#fff" opacity=".45"/>

          <!-- ============ FACES ============ -->

          <!-- idle -->
          <g class="koala-face face-idle">
            <ellipse cx="120" cy="120" rx="7" ry="9" fill="#3d3638"/>
            <ellipse cx="180" cy="120" rx="7" ry="9" fill="#3d3638"/>
            <ellipse cx="122" cy="117" rx="2" ry="2.4" fill="#fff" opacity=".7"/>
            <ellipse cx="182" cy="117" rx="2" ry="2.4" fill="#fff" opacity=".7"/>
            <path d="M138,178 Q150,186 162,178" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- sad -->
          <g class="koala-face face-sad">
            <path d="M108,104 Q120,96 132,106" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
            <path d="M168,106 Q180,96 192,104" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="120" cy="122" rx="6.5" ry="8" fill="#3d3638"/>
            <ellipse cx="180" cy="122" rx="6.5" ry="8" fill="#3d3638"/>
            <path d="M138,182 Q150,172 162,182" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
            <path class="tear" d="M183,130 C188,138 188,146 183,150 C178,146 178,138 183,130 Z" fill="#7db8d9"/>
          </g>

          <!-- happy -->
          <g class="koala-face face-happy">
            <path d="M108,118 Q120,106 132,118" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M168,118 Q180,106 192,118" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M128,170 Q150,196 172,170" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
            <g class="sparkle">
              <path d="M76,150 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 Z" fill="var(--gold, #c9a24a)"/>
            </g>
            <g class="sparkle" style="animation-delay:.5s">
              <path d="M232,140 l2.5,7 l7,2.5 l-7,2.5 l-2.5,7 l-2.5,-7 l-7,-2.5 l7,-2.5 Z" fill="var(--gold, #c9a24a)"/>
            </g>
          </g>

          <!-- angry -->
          <g class="koala-face face-angry">
            <path d="M108,112 L133,102" fill="none" stroke="#3d3638" stroke-width="4" stroke-linecap="round"/>
            <path d="M192,112 L167,102" fill="none" stroke="#3d3638" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="120" cy="124" rx="6" ry="7" fill="#3d3638"/>
            <ellipse cx="180" cy="124" rx="6" ry="7" fill="#3d3638"/>
            <path d="M136,180 L164,180" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
            <g class="steam">
              <path d="M118,44 Q112,34 118,24" fill="none" stroke="#b96a6a" stroke-width="3" stroke-linecap="round"/>
            </g>
            <g class="steam" style="animation-delay:.25s">
              <path d="M150,38 Q144,28 150,18" fill="none" stroke="#b96a6a" stroke-width="3" stroke-linecap="round"/>
            </g>
            <g class="steam" style="animation-delay:.5s">
              <path d="M182,44 Q176,34 182,24" fill="none" stroke="#b96a6a" stroke-width="3" stroke-linecap="round"/>
            </g>
          </g>

          <!-- sleepy -->
          <g class="koala-face face-sleepy">
            <path d="M110,120 Q120,128 130,120" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M170,120 Q180,128 190,120" fill="none" stroke="#3d3638" stroke-width="3.5" stroke-linecap="round"/>
            <ellipse cx="150" cy="182" rx="8" ry="6" fill="#3d3638" opacity=".85"/>
            <text class="zzz" x="196" y="70" font-family="Jost, sans-serif" font-weight="600" font-size="20" fill="var(--berenjena, #6d2f52)">z</text>
            <text class="zzz" x="212" y="54" font-family="Jost, sans-serif" font-weight="600" font-size="15" fill="var(--berenjena, #6d2f52)" style="animation-delay:.6s">z</text>
            <text class="zzz" x="224" y="42" font-family="Jost, sans-serif" font-weight="600" font-size="11" fill="var(--berenjena, #6d2f52)" style="animation-delay:1.2s">z</text>
          </g>

          <!-- sick -->
          <g class="koala-face face-sick">
            <path d="M112,116 L128,124 M128,116 L112,124" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
            <path d="M172,116 L188,124 M188,116 L172,124" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
            <path d="M140,182 Q150,178 158,182" fill="none" stroke="#3d3638" stroke-width="3" stroke-linecap="round"/>
            <ellipse class="flush" cx="94" cy="182" rx="15" ry="9" fill="#8ba86b" opacity=".5"/>
            <ellipse class="flush" cx="206" cy="182" rx="15" ry="9" fill="#8ba86b" opacity=".5"/>
            <g transform="translate(176,178) rotate(25)">
              <rect x="-3" y="-26" width="6" height="26" rx="3" fill="#fff" stroke="#c9a3a3" stroke-width="1.5"/>
              <circle cx="0" cy="0" r="6.5" fill="#d1595f"/>
            </g>
            <g transform="translate(96,66) rotate(-12)">
              <rect x="-11" y="-5" width="22" height="10" rx="3" fill="#f6efe6" stroke="#d8cdbd" stroke-width="1"/>
              <line x1="-4" y1="-5" x2="-4" y2="5" stroke="#d8cdbd" stroke-width="1"/>
              <line x1="4" y1="-5" x2="4" y2="5" stroke="#d8cdbd" stroke-width="1"/>
            </g>
          </g>

          <!-- eucalyptus leaves -->
          <path d="M40,300 C28,286 30,266 46,254 C50,272 48,288 40,300 Z" fill="var(--sage)" opacity=".9"/>
          <path d="M260,300 C272,286 270,266 254,254 C250,272 252,288 260,300 Z" fill="var(--sage)" opacity=".9"/>

        </svg>
      </div>
    </div>

    <p class="response" id="responseText"></p>
  </main>

  <footer class="credit" data-i18n="credit"></footer>

<script>
(function(){
  // bump this together with version.json on every content update
  var CURRENT_VERSION = 3;

  fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(data){
      if(data && data.v && data.v !== CURRENT_VERSION){
        location.replace(location.pathname + '?_v=' + Date.now());
      }
    })
    .catch(function(){});
})();
</script>
<script>
(function(){
  "use strict";

  var translations = {
    es: {
      heading: "¿Cómo se siente Koala hoy?",
      idle: "Toca un emoji y cuéntame",
      credit: "hecho con cariño",
      happy: "Ya te lo dije, no dejes que nadie te quite esa sonrisa 😄",
      angry: "Uy, esa carita me asusta un poquito 😅 Ven, te debo un abrazo (y prometo portarme mejor)",
      sleepy: "Yo soy Dormir... Buenas noches... Duerme con los angelitos ❤️",
      sick: "Descansa mucho, bebe agüita y deja que te cuide un poquito. Te vas a poner mejor 🌸",
      sadPool: [
        "Respira hondo, esto también va a pasar 🤍",
        "Está bien no estar bien, yo sigo aquí contigo.",
        "Eres mucho más fuerte de lo que crees, confía en ti.",
        "Un mal momento no borra todas las cosas buenas que tienes.",
        "Te mando un abrazo enorme desde aquí, no estás sola."
      ]
    },
    en: {
      heading: "How is Koala feeling today?",
      idle: "Tap an emoji and tell me",
      credit: "made with love",
      happy: "I told you so, don't let anyone take that smile away 😄",
      angry: "Uh oh, that face scares me a little 😅 Come here, I owe you a hug (and I promise to behave better)",
      sleepy: "I am Sleep... Good night... Sleep with the little angels ❤️",
      sick: "Rest a lot, drink plenty of water, and let me take care of you a little. You'll feel better soon 🌸",
      sadPool: [
        "Take a deep breath, this will pass too 🤍",
        "It's okay not to be okay, I'm still right here with you.",
        "You're so much stronger than you think, trust yourself.",
        "One bad moment doesn't erase all the good things you have.",
        "Sending you a huge hug from here, you're not alone."
      ]
    },
    hu: {
      heading: "Hogy érzi magát ma Koala?",
      idle: "Koppints egy emojira és mondd el",
      credit: "szeretettel készült",
      happy: "Megmondtam, ne hagyd, hogy bárki elvegye azt a mosolyt 😄",
      angry: "Hoppá, az az arc egy kicsit megijeszt 😅 Gyere, tartozom egy öleléssel (és ígérem, jobban fogok viselkedni)",
      sleepy: "Én vagyok az Álom... Jó éjt... Aludj az angyalkákkal ❤️",
      sick: "Pihenj sokat, igyál sok vizet, és hagyd, hogy egy kicsit vigyázzak rád. Hamarosan jobban leszel 🌸",
      sadPool: [
        "Vegyél egy mély levegőt, ez is elmúlik majd 🤍",
        "Nem baj, ha nem vagy jól, itt vagyok veled.",
        "Sokkal erősebb vagy, mint hiszed, bízz magadban.",
        "Egy rossz pillanat nem törli el a sok jó dolgot, amid van.",
        "Küldök egy hatalmas ölelést innen, nem vagy egyedül."
      ]
    }
  };

  var DEFAULT_LANG = "hu";
  var STORAGE_KEY = "sorrylili-lang";
  var currentLang = DEFAULT_LANG;
  var currentMood = null;
  var currentSadIndex = -1;

  var subtext = document.getElementById("subtext");
  var responseText = document.getElementById("responseText");
  var koalaSvg = document.getElementById("koalaSvg");
  var koalaWrap = document.getElementById("koalaWrap");
  var moodBtns = document.querySelectorAll(".mood-btn");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function detectLang(){
    try{
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved && translations[saved]) return saved;
    }catch(e){}
    return DEFAULT_LANG;
  }

  function pickNewSadIndex(){
    var pool = translations[currentLang].sadPool;
    var idx;
    do{ idx = Math.floor(Math.random() * pool.length); }
    while(pool.length > 1 && idx === currentSadIndex);
    currentSadIndex = idx;
  }

  function renderResponse(){
    if(!currentMood){
      responseText.textContent = "";
      return;
    }
    var dict = translations[currentLang];
    responseText.textContent = currentMood === "sad"
      ? dict.sadPool[currentSadIndex >= 0 ? currentSadIndex : 0]
      : dict[currentMood];
  }

  function setLang(lang){
    if(!translations[lang]) lang = "es";
    currentLang = lang;
    var dict = translations[lang];

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n");
      if(dict[key] !== undefined) el.textContent = dict[key];
    });

    document.querySelectorAll(".lang-switch button").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });

    document.documentElement.setAttribute("lang", lang);

    try{ localStorage.setItem(STORAGE_KEY, lang); }catch(e){}

    if(currentMood){ subtext.textContent = ""; }
    renderResponse();
  }

  document.querySelectorAll(".lang-switch button").forEach(function(btn){
    btn.addEventListener("click", function(){ setLang(btn.getAttribute("data-lang")); });
  });

  setLang(detectLang());

  function triggerPop(){
    koalaWrap.classList.remove("pop");
    void koalaWrap.offsetWidth;
    koalaWrap.classList.add("pop");
  }

  moodBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      var mood = btn.dataset.mood;

      if(mood === "sad"){ pickNewSadIndex(); }

      currentMood = mood;
      subtext.textContent = "";

      moodBtns.forEach(function(b){ b.classList.toggle("selected", b === btn); });

      koalaSvg.classList.remove("mood-idle","mood-sad","mood-happy","mood-angry","mood-sleepy","mood-sick");
      koalaSvg.classList.add("mood-" + mood);

      renderResponse();
      if(!reduceMotion) triggerPop();
    });
  });

  koalaWrap.addEventListener("click", function(){
    if(reduceMotion) return;
    koalaWrap.classList.remove("poked");
    void koalaWrap.offsetWidth;
    koalaWrap.classList.add("poked");
  });

  koalaSvg.classList.add("mood-idle");

})();
</script>

</body>
</html>

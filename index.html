<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Koala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#faf3e7;
    --bg-2:#f2e6d3;
    --text-main:#4a3540;
    --text-soft:#7a6360;
    --berenjena:#6d2f52;
    --rose:#c9749a;
    --gold:#c9a24a;
    --sage:#889b70;
    --sage-dark:#5c7048;
    --btn-shadow: 0 10px 28px rgba(109,47,82,.22);

    --koala-body:#a6a9ad;
    --koala-body-dark:#84878b;
    --koala-inner-ear:#e3b8c2;
    --koala-muzzle:#efe7da;
    --koala-nose:#3d3638;
    --koala-blush:#f0a8b7;

    --petal-inner:#d688a8;
    --petal-outer:#7d3258;
    --petal-center:#6d2f52;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; }

  body{
    min-height:100svh;
    min-height:100vh;
    font-family:'Jost', sans-serif;
    color:var(--text-main);
    background: radial-gradient(circle at 50% 0%, #fffaf1 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  .stage{
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding:18vh 20px 50px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition: padding-top .6s ease;
  }

  .stage.compact{ padding-top:8vh; }

  /* ---------- loading screen ---------- */
  .loading-screen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background: radial-gradient(circle at 50% 40%, #fffaf1 0%, var(--bg-1) 55%, var(--bg-2) 100%);
    transition: opacity .6s ease;
  }

  .loading-screen.hide{
    opacity:0;
    pointer-events:none;
  }

  .spinner{
    width:52px;
    height:52px;
    border-radius:50%;
    border:4px solid rgba(109,47,82,.15);
    border-top-color:var(--berenjena);
    animation: spin .9s linear infinite;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .loading-screen p{
    font-family:'Cormorant Garamond', serif;
    font-size:1.05rem;
    color:var(--text-soft);
    margin:0;
  }

  /* ---------- language switcher ---------- */
  .lang-switch{
    position:fixed;
    top:16px;
    right:16px;
    display:flex;
    gap:6px;
    z-index:20;
    background:rgba(255,251,244,.7);
    backdrop-filter: blur(6px);
    padding:5px;
    border-radius:999px;
    box-shadow:0 4px 14px rgba(109,47,82,.10);
  }

  .lang-switch button{
    font-size:19px;
    line-height:1;
    border:none;
    background:transparent;
    padding:6px 8px;
    border-radius:999px;
    cursor:pointer;
    opacity:.55;
    transform:scale(.92);
    transition: opacity .2s ease, transform .2s ease, background .2s ease;
  }

  .lang-switch button.active{
    opacity:1;
    transform:scale(1);
    background:rgba(109,47,82,.12);
  }

  /* ---------- intro block ---------- */
  .intro-block{
    transition: margin .5s ease;
  }

  .heading{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 7vw, 2.2rem);
    margin:0 0 8px;
    color:var(--text-main);
    transition: font-size .5s ease;
  }

  .stage.compact .heading{
    font-size:clamp(1.25rem, 5.5vw, 1.6rem);
  }

  .subtext{
    font-family:'Jost', sans-serif;
    font-size:.95rem;
    color:var(--text-soft);
    margin:0 0 26px;
    min-height:1.3em;
    transition: opacity .3s ease, margin .3s ease, max-height .3s ease;
    overflow:hidden;
  }

  .subtext.gone{
    opacity:0;
    margin:0;
    max-height:0;
    min-height:0;
  }

  /* ---------- mood buttons ---------- */
  .mood-options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }

  .mood-btn{
    width:56px;
    height:56px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.7rem;
    line-height:1;
    background:rgba(255,255,255,.55);
    border:1.5px solid transparent;
    border-radius:50%;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, width .4s ease, height .4s ease, font-size .4s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .stage.compact .mood-btn{
    width:46px;
    height:46px;
    font-size:1.4rem;
  }

  .mood-btn:hover{ transform:translateY(-2px); }

  .mood-btn.selected{
    border-color:var(--rose);
    background:#fffaf3;
    transform:scale(1.1);
  }

  /* special one-off mood: gradient ring + soft pulsing glow so it stands out */
  .mood-btn.mood-special,
  .mood-btn.mood-special.selected{
    position:relative;
    border:2.5px solid transparent;
    background:
      linear-gradient(#fffaf3, #fffaf3) padding-box,
      linear-gradient(135deg, var(--gold), var(--rose), var(--berenjena)) border-box;
    animation: specialGlow 1.9s ease-in-out infinite;
  }
  .mood-btn.mood-special::after{
    content:"✨";
    position:absolute;
    top:-7px;
    right:-5px;
    font-size:.8rem;
  }
  @keyframes specialGlow{
    0%, 100%{ box-shadow:0 0 0 0 rgba(201,116,154,.45), 0 0 10px rgba(201,162,74,.25); }
    50%{ box-shadow:0 0 0 7px rgba(201,116,154,0), 0 0 18px rgba(201,162,74,.55); }
  }

  /* ---------- koala scene ---------- */
  .koala-scene{
    width:100%;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .7s ease, opacity .6s ease, margin-top .6s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .koala-scene.revealed{
    max-height:900px;
    opacity:1;
    margin-top:22px;
  }
  .koala-scene.revealed.tall{ max-height:9000px; }

  .koala-scene.leaving{
    max-height:0;
    opacity:0;
    margin-top:0;
  }

  .koala-breathe{
    width:min(66vw, 250px);
    filter: drop-shadow(0 16px 22px rgba(109,47,82,.16));
    animation: idleBreathe 4s ease-in-out infinite;
  }

  .koala-wrap{ cursor:pointer; }
  .koala-wrap.pop{ animation: popBounce .55s ease; }
  .koala-wrap.poked{ animation: wiggle .5s ease; }
  .koala-svg{ width:100%; height:auto; display:block; overflow:visible; }

  @keyframes idleBreathe{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.02); }
  }
  @keyframes popBounce{
    0%{ transform:scale(.85) rotate(0); }
    40%{ transform:scale(1.1) rotate(-3deg); }
    70%{ transform:scale(.97) rotate(2deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  @keyframes wiggle{
    0%, 100%{ transform:rotate(0); }
    20%{ transform:rotate(-8deg); }
    40%{ transform:rotate(7deg); }
    60%{ transform:rotate(-5deg); }
    80%{ transform:rotate(3deg); }
  }

  /* koala part-by-part draw-in (plays once) */
  .draw-part{
    opacity:0;
    transform:scale(.4);
    transform-box: view-box;
    transform-origin: center;
  }
  .koala-scene.drawn .draw-part{
    animation: partReveal .55s cubic-bezier(.31,1.4,.5,1) forwards;
  }
  .koala-scene.drawn .part-1{ animation-delay:0s; }
  .koala-scene.drawn .part-2{ animation-delay:.12s; }
  .koala-scene.drawn .part-3{ animation-delay:.24s; }
  .koala-scene.drawn .part-4{ animation-delay:.36s; }
  .koala-scene.drawn .part-5{ animation-delay:.48s; }
  .koala-scene.drawn .part-6{ animation-delay:.6s; }

  @keyframes partReveal{
    0%{ opacity:0; transform:scale(.4); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:scale(1); }
  }

  /* crossfade between mood faces */
  .koala-face{
    opacity:0;
    transition: opacity .45s ease;
  }
  .koala-face.active{ opacity:1; }

  @keyframes dripTear{
    0%{ transform:translateY(0); opacity:1; }
    75%{ opacity:1; }
    100%{ transform:translateY(16px); opacity:0; }
  }
  .face-sad .tear{ animation: dripTear 1.7s ease-in infinite; }

  @keyframes blinkIdle{
    0%, 88%, 100%{ transform:scaleY(1); }
    92%{ transform:scaleY(.1); }
  }
  .face-idle .eye{ animation: blinkIdle 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

  @keyframes floatZzz{
    0%{ transform:translateY(0); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:translateY(-20px); opacity:0; }
  }
  .face-sleepy .zzz{ animation: floatZzz 2.6s ease-in-out infinite; }

  @keyframes steamFlicker{
    0%, 100%{ opacity:.25; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(-4px); }
  }
  .face-angry .steam{ animation: steamFlicker 1s ease-in-out infinite; }

  @keyframes sparklePulse{
    0%, 100%{ opacity:.35; transform:scale(.75); }
    50%{ opacity:1; transform:scale(1.15); }
  }
  .face-happy .sparkle{ animation: sparklePulse 1.5s ease-in-out infinite; }

  @keyframes flushPulse{
    0%, 100%{ opacity:.45; }
    50%{ opacity:.85; }
  }
  .face-sick .flush{ animation: flushPulse 1.7s ease-in-out infinite; }

  @keyframes floatHeart{
    0%{ transform:translateY(0) scale(.7); opacity:0; }
    20%{ opacity:1; }
    100%{ transform:translateY(-22px) scale(1); opacity:0; }
  }
  .face-loved .floaty-heart{ animation: floatHeart 2.2s ease-in-out infinite; }

  @keyframes droopBlink{
    0%, 80%, 100%{ transform:scaleY(1); }
    90%{ transform:scaleY(.25); }
  }
  .face-bored .droopy-eye{ animation: droopBlink 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

  @keyframes driftDots{
    0%{ transform:translateY(0); opacity:0; }
    25%{ opacity:.8; }
    100%{ transform:translateY(-14px); opacity:0; }
  }
  .face-bored .bored-dots{ animation: driftDots 3s ease-in-out infinite; }

  @keyframes flameFlicker{
    0%, 100%{ opacity:.65; transform:scale(.92) translateY(0); }
    50%{ opacity:1; transform:scale(1.08) translateY(-3px); }
  }
  .face-desire .flame{ animation: flameFlicker 1.1s ease-in-out infinite; }

  @keyframes floatNote{
    0%{ transform:translateY(0) rotate(0); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:translateY(-22px) rotate(8deg); opacity:0; }
  }
  .face-musical .note{ animation: floatNote 2.4s ease-in-out infinite; }

  .face-sorry .bouquet{
    transform-box: view-box;
    transform-origin: 0 0;
    animation: bouquetSway 3.2s ease-in-out infinite;
  }
  .face-sorry .sorry-worried, .face-sorry .sorry-glad{ transition: opacity .5s ease; }
  .face-sorry .sorry-glad{ opacity:0; }
  .face-sorry.glad .sorry-worried{ opacity:0; }
  .face-sorry.glad .sorry-glad{ opacity:1; }
  .face-sorry.glad .glad-heart{ animation: floatHeart 2.2s ease-in-out infinite; }
  .face-sorry.glad .bouquet{ animation-duration:1.6s; }
  @keyframes bouquetSway{
    0%, 100%{ transform:rotate(-3deg); }
    50%{ transform:rotate(3deg); }
  }

  /* ---------- sorry box: message + envelope + letter ---------- */
  .sorry-box{
    display:none;
    width:100%;
    flex-direction:column;
    align-items:center;
    margin-top:18px;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .sorry-box.applicable{ display:flex; }
  .sorry-box.show{ opacity:1; transform:translateY(0); }

  .sorry-msg{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:clamp(1.05rem, 4.3vw, 1.25rem);
    line-height:1.55;
    color:var(--berenjena);
    max-width:30ch;
    margin:0 0 6px;
  }

  .envelope-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:72px;
    max-height:300px;
    overflow:visible;
    transition: max-height .6s ease, opacity .5s ease, margin .5s ease;
  }
  .envelope-wrap.gone{
    max-height:0;
    opacity:0;
    margin:0;
    padding-top:0;
    pointer-events:none;
  }

  .envelope{
    position:relative;
    width:170px;
    height:112px;
    padding:0;
    border:none;
    background:none;
    cursor:pointer;
    perspective:600px;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 10px 16px rgba(109,47,82,.2));
    animation: envelopeNudge 2.6s ease-in-out infinite;
  }
  @keyframes envelopeNudge{
    0%, 70%, 100%{ transform:rotate(0) scale(1); }
    76%{ transform:rotate(-4deg) scale(1.04); }
    82%{ transform:rotate(4deg) scale(1.04); }
    88%{ transform:rotate(-2deg) scale(1.02); }
  }
  .envelope.open{ animation:none; }

  .envelope span{ position:absolute; display:block; }
  .env-back{
    inset:0;
    background:#f0cfdc;
    border-radius:6px;
  }
  .env-letter{
    left:10px; right:10px; top:10px; bottom:6px;
    background:#fffaf3;
    border-radius:4px;
    transition: transform .6s ease .45s;
    z-index:1;
  }
  .env-front{
    inset:0;
    background:#f7dfe8;
    border-radius:6px;
    clip-path: polygon(0 32%, 50% 68%, 100% 32%, 100% 100%, 0 100%);
    z-index:2;
  }
  .env-flap{
    left:0; right:0; top:0;
    height:70%;
    background:#e9bccd;
    border-radius:6px 6px 0 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .6s ease, z-index 0s linear .3s;
    z-index:3;
  }
  .env-seal{
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    font-size:20px;
    color:#c0245a;
    z-index:4;
    transition: opacity .3s ease;
  }
  .envelope.open .env-flap{ transform:rotateX(180deg); z-index:0; }
  .envelope.open .env-seal{ opacity:0; }
  .envelope.open .env-letter{ transform:translateY(-44px); }

  .envelope-hint{
    font-family:'Jost', sans-serif;
    font-size:.85rem;
    color:var(--berenjena);
    margin:14px 0 0;
    animation: hintPulse 1.8s ease-in-out infinite;
  }
  @keyframes hintPulse{
    0%, 100%{ opacity:.55; }
    50%{ opacity:1; }
  }

  .letter{
    display:none;
    width:100%;
    max-width:340px;
    transform-origin: top center;
  }
  .letter.show{
    display:block;
    animation: letterUnfold .8s cubic-bezier(.25,1.2,.4,1) forwards;
  }
  @keyframes letterUnfold{
    0%{ opacity:0; transform:scaleY(.15) translateY(-20px); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:scaleY(1) translateY(0); }
  }
  .letter-paper{
    text-align:left;
    background:
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, rgba(201,116,154,.18) 31px, rgba(201,116,154,.18) 32px),
      #fffaf3;
    border-radius:8px;
    padding:22px 22px 18px;
    box-shadow: 0 14px 30px rgba(109,47,82,.16), inset 0 0 0 1px rgba(201,116,154,.18);
    font-family:'Caveat', cursive;
    font-size:1.35rem;
    line-height:32px;
    color:#4a3540;
  }
  .letter-paper p{ margin:0 0 10px; }
  .letter-greeting{ font-weight:600; color:var(--berenjena); }
  .letter-sign{
    text-align:right;
    font-weight:600;
    color:var(--berenjena);
    margin-top:14px !important;
  }
  .letter-footer{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:10px;
    margin-top:18px;
  }
  .letter-footer .letter-sign{ margin:0 !important; padding-bottom:4px; }
  .letter-paper .letter-ps{
    margin:22px 0 0;
    font-size:1.2rem;
    line-height:26px;
    color:var(--rose);
    transform:rotate(-1.5deg);
  }

  /* ---------- little gift inside the letter ---------- */
  .gift-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    max-width:130px;
    padding:0;
    border:0;
    background:none;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .gift-hint{
    font-family:'Caveat', cursive;
    font-size:1.05rem;
    line-height:1.1;
    color:var(--rose);
    text-align:center;
  }
  .gift-card{
    position:relative;
    display:block;
    width:62px;
    height:44px;
    border-radius:6px;
    background:linear-gradient(135deg, #f6c9dc, #e9a3c0);
    box-shadow:0 6px 14px rgba(109,47,82,.22);
    animation: giftWiggle 2.6s ease-in-out infinite, giftGlow 2.6s ease-in-out infinite;
  }
  .gift-card::before, .gift-card::after{
    content:"";
    position:absolute;
    background:var(--gold);
  }
  .gift-card::before{ left:50%; top:0; bottom:0; width:7px; margin-left:-3.5px; }
  .gift-card::after{ top:50%; left:0; right:0; height:7px; margin-top:-3.5px; }
  .gift-bow{
    position:absolute;
    left:50%;
    top:-15px;
    transform:translateX(-50%);
    font-size:1.25rem;
    line-height:1;
    z-index:1;
  }
  @keyframes giftWiggle{
    0%, 62%, 100%{ transform:rotate(0) scale(1); }
    68%{ transform:rotate(-9deg) scale(1.06); }
    74%{ transform:rotate(8deg) scale(1.06); }
    80%{ transform:rotate(-6deg) scale(1.04); }
    86%{ transform:rotate(4deg) scale(1.02); }
    92%{ transform:rotate(0) scale(1); }
  }
  @keyframes giftGlow{
    0%, 100%{ box-shadow:0 6px 14px rgba(109,47,82,.22), 0 0 0 0 rgba(201,162,74,0); }
    70%{ box-shadow:0 6px 14px rgba(109,47,82,.22), 0 0 16px 4px rgba(201,162,74,.45); }
  }

  /* ---------- lily petals falling behind the page once the letter opens ---------- */
  .petal-rain{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-30px;
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    opacity:.9;
    animation: petalRainFall linear forwards;
  }
  @keyframes petalRainFall{
    0%{ transform:translate(0, 0) rotate(0); }
    25%{ transform:translate(var(--sway), 27vh) rotate(calc(var(--rot) * .25)); }
    50%{ transform:translate(calc(var(--sway) * -1), 55vh) rotate(calc(var(--rot) * .5)); }
    75%{ transform:translate(var(--sway), 82vh) rotate(calc(var(--rot) * .75)); opacity:.9; }
    100%{ transform:translate(0, 112vh) rotate(var(--rot)); opacity:0; }
  }

  /* ---------- massage voucher (full screen) ---------- */
  .voucher-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    background:rgba(60,24,46,.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity:0;
    transition: opacity .35s ease;
    overflow:hidden;
  }
  .voucher-overlay.applicable{ display:flex; }
  .voucher-overlay.show{ opacity:1; }
  .voucher{
    position:relative;
    width:100%;
    max-width:330px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:scale(.4) rotate(-8deg);
    opacity:0;
  }
  .voucher-overlay.show .voucher{ animation: voucherPop .75s cubic-bezier(.25,1.4,.4,1) forwards; }
  @keyframes voucherPop{
    0%{ transform:scale(.4) rotate(-8deg); opacity:0; }
    60%{ transform:scale(1.05) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }
  .voucher-ticket{
    position:relative;
    width:100%;
    padding:30px 22px 22px;
    border-radius:18px;
    background:linear-gradient(160deg, #fffaf3 0%, #fdeef4 100%);
    box-shadow:0 22px 50px rgba(0,0,0,.28);
    text-align:center;
    color:var(--berenjena);
  }
  .voucher-ticket::before{
    content:"";
    position:absolute;
    inset:8px;
    border:2px dashed rgba(201,116,154,.55);
    border-radius:12px;
    pointer-events:none;
  }
  .voucher-koala{
    position:absolute;
    left:50%;
    top:-44px;
    width:86px;
    margin-left:-43px;
    transform-origin:50% 100%;
  }
  .voucher-overlay.show .voucher-koala{ animation: koalaPeek 1.1s cubic-bezier(.25,1.4,.4,1) .35s both, koalaNod 2.4s ease-in-out 1.5s infinite; }
  @keyframes koalaPeek{
    0%{ transform:translateY(40px) scale(.6); opacity:0; }
    100%{ transform:translateY(0) scale(1); opacity:1; }

  @keyframes koalaNod{

  /* ---------- response ---------- */
  .response{

  .player-box{

    text-align:center;

  .player-controls{
    display:flex;
    align-items:center;
    gap:12px;

  }

  .player-btn{
    flex:none;
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    color:#fff8f0;
    background:linear-gradient(135deg, var(--rose), var(--berenjena));

    font-size:1rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }

  .player-progress{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:5px;
    border-radius:999px;
    background:rgba(122,99,96,.22);
    outline:none;
    cursor:pointer;
  }
  .player-progress::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--berenjena);
    cursor:pointer;
  }
  .player-progress::-moz-range-thumb{
    width:14px;
    height:14px;
    border:none;
    border-radius:50%;
    background:var(--berenjena);

  .song-switch{
    margin-top:14px;

    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }

  .song-btn{
    font-family:'Jost', sans-serif;
    font-size:.78rem;
    font-weight:500;
    color:var(--berenjena);
    background:#fff8f0;
    border:1.5px solid rgba(109,47,82,.3);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .song-btn:hover{
    background:#fdeef5;
    transform:translateY(-1px);
  }
  .song-btn.active{
    background:linear-gradient(135deg, var(--rose), var(--berenjena));
    color:#fff8f0;
    border-color:transparent;
  }

  /* ---------- floating background effects (hearts / claps / happy) ----------
     each span is fired individually via JS (add .fly, single run); pausing a
     song just stops firing new ones, it never yanks ones already mid-flight */
  .bg-fx{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-fx span{
    position:absolute;
    bottom:-10vh;
    color:#e0527a;
    opacity:0;
  }
  .bg-fx span.fly{
    animation-name: floatBg;
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-fill-mode: forwards;
  }
  @keyframes floatBg{
    0%{ transform:translateY(0) scale(.85); opacity:0; }
    10%{ opacity:.6; }
    88%{ opacity:.5; }
    100%{ transform:translateY(-120vh) scale(1.15); opacity:0; }
  }

  /* ---------- angry sub-box ---------- */
  .angry-box{
    margin-top:20px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .5s ease, opacity .4s ease, margin-top .4s ease;
  }
  .angry-box.show{
    max-height:260px;
    opacity:1;
  }

  .angry-question{
    font-family:'Cormorant Garamond', serif;
    font-size:1.1rem;
    margin:0 0 12px;
    color:var(--text-main);
  }

  .angry-buttons{ display:flex; gap:12px; justify-content:center; }

  .angry-buttons button{
    font-family:'Jost', sans-serif;
    font-size:.9rem;
    font-weight:500;
    padding:10px 24px;
    border-radius:999px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }

  #angryYes{
    border:none;
    color:#fff8f0;
    background:linear-gradient(135deg, var(--rose), var(--berenjena));
    box-shadow:var(--btn-shadow);
  }

  #angryNo{
    background:transparent;
    border:1.5px solid rgba(122,99,96,.35);
    color:var(--text-soft);
  }

  .angry-calm{
    font-family:'Cormorant Garamond', serif;
    font-size:1.1rem;
    color:var(--berenjena);
    margin:14px 0 0;
    opacity:0;
    transition: opacity .4s ease;
  }
  .angry-calm.show{ opacity:1; }

  /* ---------- lily scene ---------- */
  .lily-scene{
    width:100%;
    max-height:0;
    opacity:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition: max-height .8s ease, opacity .7s ease, margin-top .6s ease;
  }
  .lily-scene.show{
    max-height:900px;
    opacity:1;
    margin-top:10px;
  }

  .lily-wrap{
    width:min(72vw, 280px);
    filter: drop-shadow(0 18px 24px rgba(109,47,82,.16));
    position:relative;
  }

  .lily-svg{ width:100%; height:auto; display:block; overflow:visible; }

  .lily-plant{
    transform-box: view-box;
    transform-origin: 150px 392px;
  }
  .lily-scene.swaying .lily-plant{
    animation: lilySway 5.5s ease-in-out infinite;
  }
  @keyframes lilySway{
    0%{ transform:rotate(-2deg); }
    50%{ transform:rotate(2.2deg); }
    100%{ transform:rotate(-2deg); }
  }

  .lily-plant.flying-away{
    animation: flyAway 1.1s ease-in forwards;
  }
  @keyframes flyAway{
    0%{ transform:translate(0,0) rotate(0) scale(1); opacity:1; }
    100%{ transform:translate(75px,-95px) rotate(35deg) scale(.55); opacity:0; }
  }

  .petal-rotate{ transform-box:view-box; transform-origin:0 0; }
  .petal-bloom{
    transform-box:view-box;
    transform-origin:0 0;
    transform:scale(.14);
    opacity:.5;
  }
  .lily-scene.drawn .petal-bloom{
    animation: petalBloom 1.2s cubic-bezier(.31,1.4,.5,1) forwards;
  }
  .lp0 .petal-bloom{ animation-delay:0s; }
  .lp1 .petal-bloom{ animation-delay:.14s; }
  .lp2 .petal-bloom{ animation-delay:.28s; }
  .lp3 .petal-bloom{ animation-delay:.42s; }
  .lp4 .petal-bloom{ animation-delay:.56s; }

  @keyframes petalBloom{
    0%{ transform:scale(.14); opacity:.5; }
    60%{ opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  .petal-fall{ transform-box:view-box; transform-origin:0 0; cursor:pointer; }
  .petal-fall.fallen{
    animation: petalFall .8s ease-in forwards;
    pointer-events:none;
  }
  .petal-fall.regrowing{
    animation: petalRegrow .7s cubic-bezier(.31,1.4,.5,1) forwards;
  }
  @keyframes petalFall{
    0%{ transform:translate(0,0) rotate(0); opacity:1; }
    100%{ transform:translate(14px,70px) rotate(75deg); opacity:0; }
  }
  @keyframes petalRegrow{
    0%{ transform:translate(14px,70px) rotate(75deg); opacity:0; }
    100%{ transform:translate(0,0) rotate(0); opacity:1; }
  }

  .petal-label{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:15px;
    fill:var(--berenjena);
    opacity:0;
    text-anchor:middle;
    pointer-events:none;
  }
  .petal-label.pop{ animation: labelPop 1.3s ease forwards; }
  .petal-label.final{ font-size:20px; fill:#c0245a; }
  @keyframes labelPop{
    0%{ opacity:0; transform:translateY(6px); }
    20%{ opacity:1; transform:translateY(-6px); }
    80%{ opacity:1; transform:translateY(-14px); }
    100%{ opacity:0; transform:translateY(-22px); }
  }

  .heart{
    opacity:0;
    transform-box:view-box;
    transform-origin:center;
  }
  .heart.burst{ animation: heartBurst 1.4s ease forwards; }
  @keyframes heartBurst{
    0%{ opacity:0; transform:translateY(0) scale(.3); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-60px) scale(1.1); }
  }

  .lily-message{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(1.1rem, 4.4vw, 1.35rem);
    line-height:1.55;
    color:var(--berenjena);
    max-width:28ch;
    margin:22px 0 0;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .lily-message.show{ opacity:1; transform:translateY(0); }

  .petal-hint{
    font-family:'Jost', sans-serif;
    font-size:.85rem;
    color:var(--text-soft);
    margin:10px 0 0;
    opacity:0;
    transition: opacity .5s ease;
  }
  .petal-hint.show{ opacity:.8; }

  /* ---------- forgive box ---------- */
  .forgive-box{
    /* no transform here on purpose: a transform on an ancestor would make
       #forgiveNo's position:fixed (while dodging) position relative to
       this box instead of the viewport */
    margin-top:38px;
    opacity:0;
    transition: opacity .6s ease, margin-top .6s ease;
  }
  .forgive-box.show{ opacity:1; margin-top:30px; }

  .forgive-question{
    font-family:'Cormorant Garamond', serif;
    font-size:1.1rem;
    margin:0 0 12px;
    color:var(--text-main);
  }

  .forgive-buttons{ display:flex; gap:12px; justify-content:center; }

  .forgive-buttons button{
    font-family:'Jost', sans-serif;
    font-size:.9rem;
    font-weight:500;
    padding:10px 24px;
    border-radius:999px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }

  #forgiveYes{
    border:none;
    color:#fff8f0;
    background:linear-gradient(135deg, var(--rose), var(--berenjena));
    box-shadow:var(--btn-shadow);
  }

  #forgiveNo{
    background:transparent;
    border:1.5px solid rgba(122,99,96,.35);
    color:var(--text-soft);
  }

  #forgiveNo.dodging{
    position:fixed;
    z-index:30;
    transition: left .3s ease, top .3s ease;
  }

  #notifyNo{
    background:transparent;
    border:1.5px solid rgba(122,99,96,.35);
    color:var(--text-soft);
  }

  .btn-green{
    border:none;
    color:#fff;
    background:#25D366;
    box-shadow:0 8px 20px rgba(37,211,102,.28);
  }

  .notify-box{
    margin-top:0;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition: opacity .4s ease, max-height .4s ease, margin-top .4s ease;
  }
  .notify-box.show{
    opacity:1;
    max-height:160px;
    margin-top:22px;
  }

  .forgive-box.answered > .forgive-question,
  .forgive-box.answered > .forgive-buttons{ display:none; }

  .forgive-thanks{
    display:none;
    font-family:'Cormorant Garamond', serif;
    font-size:1.1rem;
    color:var(--berenjena);
    margin:0;
  }
  .forgive-box.answered .forgive-thanks{ display:block; }

  .forgive-hearts{ margin-top:8px; }
  .forgive-hearts span{
    display:inline-block;
    font-size:20px;
    margin:0 4px;
    opacity:0;
    color:#c0245a;
  }
  .forgive-hearts.burst span{ animation: heartPop 1.3s ease forwards; }
  .forgive-hearts.burst span:nth-child(2){ animation-delay:.12s; }
  .forgive-hearts.burst span:nth-child(3){ animation-delay:.24s; }
  .forgive-hearts.burst span:nth-child(4){ animation-delay:.36s; }
  @keyframes heartPop{
    0%{ opacity:0; transform:translateY(0) scale(.4); }
    30%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-28px) scale(1.15); }
  }

  .back-link{
    display:inline-block;
    margin-top:20px;
    font-family:'Jost', sans-serif;
    font-size:.85rem;
    color:var(--text-soft);
    text-decoration:none;
    border-bottom:1px solid rgba(122,99,96,.35);
    padding-bottom:1px;
    opacity:0;
    max-height:0;
    overflow:hidden;
    pointer-events:none;
    transition: opacity .5s ease;
    cursor:pointer;
  }
  .back-link.enabled{
    opacity:.8;
    max-height:40px;
    pointer-events:auto;
  }

  footer.credit{
    margin-top:34px;
    text-align:center;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--text-soft);
    opacity:.55;
  }

  @media (prefers-reduced-motion: reduce){
    .gift-card{ animation:none; }
    .petal-rain{ display:none; }
    .voucher-overlay.show .voucher-koala{ animation:none; }
    .face-sorry.glad .glad-heart{ animation:none; }
    .voucher-overlay.show .voucher{ animation:none; transform:none; opacity:1; }
    .voucher-burst{ display:none; }
    .koala-breathe{ animation:none; }
    .koala-wrap.pop, .koala-wrap.poked{ animation:none; }
    .draw-part{ opacity:1; transform:scale(1); }
    .koala-scene.drawn .draw-part{ animation:none; }
    .face-idle .eye{ animation:none; }
    .face-sad .tear,
    .face-sleepy .zzz,
    .face-angry .steam,
    .face-happy .sparkle,
    .face-sick .flush,
    .face-loved .floaty-heart,
    .face-bored .droopy-eye,
    .face-bored .bored-dots,
    .face-desire .flame,
    .face-musical .note{ animation:none; opacity:1; }
    .mood-btn.mood-special,
    .face-sorry .bouquet,
    .envelope,
    .envelope-hint{ animation:none; }
    .env-flap, .env-letter, .envelope-wrap{ transition:none; }
    .letter.show{ animation:none; opacity:1; }
    .bg-fx{ display:none !important; }
    .lily-scene .lily-plant{ animation:none; }
    .petal-bloom{ transform:scale(1); opacity:1; }
    .lily-scene.drawn .petal-bloom{ animation:none; }
    .petal-fall.fallen, .petal-fall.regrowing{ transition:none; }
    #forgiveNo.dodging{ transition:none; }
    .forgive-hearts.burst span{ animation:none; opacity:1; }
  }
</style>

  // real koala sound clip; playbackRate/volume are randomized a bit each
  // time so repeated taps don't sound identical. Falls back to a tiny
  // synthesized chirp if the file can't be loaded/played for some reason.
  var KOALA_AUDIO_SRC = "Sonidos/KoalaSonido.wav";

  function playSynthKoalaSound(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      if(!audioCtx) audioCtx = new Ctx();
      if(audioCtx.state === "suspended") audioCtx.resume();

      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(480, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.16);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    }catch(e){}
  }

  var audioCtx = null;
  var koalaBuffer = null;

  function getAudioCtx(){
    if(!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }

  // decode the clip into memory as soon as the page loads (no user
  // gesture needed for this part), so the very first tap plays instantly
  // instead of waiting on a fetch + decode
  (function preloadKoalaBuffer(){
    var ctx = getAudioCtx();
    if(!ctx) return;
    fetch(KOALA_AUDIO_SRC)
      .then(function(res){ return res.arrayBuffer(); })
      .then(function(data){ return ctx.decodeAudioData(data); })
      .then(function(buf){ koalaBuffer = buf; })
      .catch(function(){});
  })();

  function playKoalaSound(){
    var ctx = getAudioCtx();
    if(ctx && ctx.state === "suspended") ctx.resume();

    if(ctx && koalaBuffer){
      try{
        var source = ctx.createBufferSource();
        var gain = ctx.createGain();
        source.buffer = koalaBuffer;
        source.playbackRate.value = 0.88 + Math.random() * 0.28;
        gain.gain.value = 0.055 + Math.random() * 0.0275;
        source.connect(gain);
        gain.connect(ctx.destination);
        source.start(0);
        return;
      }catch(e){}
    }

    // buffer not ready yet (e.g. very first tap before the fetch finished)
    // or something failed — fall back to a plain <audio> play
    try{
      var audio = new Audio(KOALA_AUDIO_SRC);
      audio.playbackRate = 0.88 + Math.random() * 0.28;
      audio.volume = 0.06 + Math.random() * 0.0275;
      audio.addEventListener("error", playSynthKoalaSound, { once:true });
      var played = audio.play();
      if(played && played.catch) played.catch(playSynthKoalaSound);
    }catch(e){
      playSynthKoalaSound();
    }
  }

  }

  envelope.addEventListener("click", function(){
    if(envelope.classList.contains("open")) return;
    envelope.classList.add("open");
    buzz([20, 40, 20]);
    letterTimer = window.setTimeout(function(){
      envelopeWrap.classList.add("gone");
      letter.classList.add("show");
      startPetals();
      faceSorry.classList.add("glad");
      koalaWrap.classList.remove("pop");
      void koalaWrap.offsetWidth;
      koalaWrap.classList.add("pop");
    }, reduceMotion ? 0 : 1300);
  });

  // ---------- massage voucher ----------
  var giftBtn = document.getElementById("giftBtn");
  var voucherOverlay = document.getElementById("voucherOverlay");
  var voucherClose = document.getElementById("voucherClose");
  var voucherWa = document.getElementById("voucherWa");
  var VOUCHER_MSG = "Hey Cuchicú, I want to redeem my massage voucher 💆‍♀️💕";
  voucherWa.href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(VOUCHER_MSG);
  var voucherTimer = null;

  function voucherBurst(){
    var icons = ["💕", "✨", "💖", "🌸", "✨", "💗"];
    for(var i = 0; i < 12; i++){
      var el = document.createElement("span");
      el.className = "voucher-burst";
      el.textContent = icons[i % icons.length];
      var angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
      var dist = 130 + Math.random() * 70;
      el.style.setProperty("--dx", Math.round(Math.cos(angle) * dist) + "px");
      el.style.setProperty("--dy", Math.round(Math.sin(angle) * dist) + "px");
      voucherOverlay.appendChild(el);
      (function(node){ window.setTimeout(function(){ node.remove(); }, 1400); })(el);
    }
  }

  function openVoucher(){
    if(voucherTimer){ window.clearTimeout(voucherTimer); voucherTimer = null; }
    voucherOverlay.classList.add("applicable");
    voucherOverlay.setAttribute("aria-hidden", "false");
    document.documentElement.style.overflow = "hidden";
    window.requestAnimationFrame(function(){
      window.requestAnimationFrame(function(){ voucherOverlay.classList.add("show"); });
    });
    buzz([20, 40, 20, 40, 30]);
    faceSorry.classList.add("glad");
    if(!reduceMotion) voucherBurst();
  }

  function closeVoucher(){
    if(!voucherOverlay.classList.contains("applicable")) return;
    voucherOverlay.classList.remove("show");
    voucherOverlay.setAttribute("aria-hidden", "true");
    document.documentElement.style.overflow = "";
    voucherTimer = window.setTimeout(function(){
      voucherOverlay.classList.remove("applicable");
      voucherTimer = null;
    }, 350);
  }

  giftBtn.addEventListener("click", openVoucher);
  voucherClose.addEventListener("click", closeVoucher);
  voucherOverlay.addEventListener("click", function(e){
    if(e.target === voucherOverlay) closeVoucher();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeVoucher();
  });

  koalaWrap.addEventListener("click", function(){
    buzz(15);
    if(currentMood === "musical"){
      toggleMusic();
    }else{
      playKoalaSound();
    }
    if(reduceMotion) return;
    koalaWrap.classList.remove("poked");
    void koalaWrap.offsetWidth;
    koalaWrap.classList.add("poked");
  });

  angryNo.addEventListener("click", function(){
    angryCalm.textContent = translations[currentLang].angryCalm;
    angryCalm.classList.add("show");
  });

  angryYes.addEventListener("click", function(){
    introBlock.style.display = "none";
    koalaScene.classList.add("leaving");
    window.setTimeout(function(){
      koalaScene.style.display = "none";
      showLily();
    }, reduceMotion ? 0 : 700);
  });

  backLink.addEventListener("click", function(e){
    e.preventDefault();
    if(!backLink.classList.contains("enabled")) return;

    if(regrowTimer){
      window.clearTimeout(regrowTimer);
      regrowTimer = null;
    }

    lilyScene.classList.remove("show", "drawn", "swaying");
    introBlock.style.display = "";
    koalaScene.style.display = "";
    koalaScene.classList.remove("leaving");
  });

  // ---------- lily scene ----------
  var petalLovesMe = [true, false, true, false, true];
  var pickCount = 0;
  var fallenCount = 0;
  var regrowTimer = null;
  var petalListenersAttached = false;

  var lilyPalettes = [
    { outer:"#7d3258", inner:"#d688a8", center:"#6d2f52" },
    { outer:"#c1522a", inner:"#f2a56a", center:"#8a3a1c" },
    { outer:"#5b4e8c", inner:"#b6a4dd", center:"#453a72" },
    { outer:"#b8860b", inner:"#f4d488", center:"#8a660a" },
    { outer:"#d998b0", inner:"#fbeaf1", center:"#c26f92" }
  ];
  var flowerIndex = 0;

  function applyLilyPalette(i){
    var p = lilyPalettes[i % lilyPalettes.length];
    document.documentElement.style.setProperty("--petal-outer", p.outer);
    document.documentElement.style.setProperty("--petal-inner", p.inner);
    document.documentElement.style.setProperty("--petal-center", p.center);
  }

  function showLily(){
    applyLilyPalette(flowerIndex);
    resetForNewFlower();

    forgiveBox.classList.remove("show", "answered");
    forgiveHearts.classList.remove("burst");
    notifyBox.classList.remove("show");
    backLink.classList.remove("enabled");
    petalHint.classList.remove("show");
    lilyMessage.classList.remove("show");

    lilyScene.classList.add("show");
    window.requestAnimationFrame(function(){
      lilyScene.classList.add("drawn");
    });

    var bloomTime = reduceMotion ? 0 : 1200;
    window.setTimeout(function(){
      lilyScene.classList.add("swaying");
      lilyMessage.classList.add("show");
      petalHint.classList.add("show");
      forgiveBox.classList.add("show");
    }, bloomTime + 200);

    if(!petalListenersAttached){
      lilySvg.querySelectorAll(".petal-fall").forEach(function(p){
        p.addEventListener("click", onPetalTap);
      });
      petalListenersAttached = true;
    }
  }

  function visibleViewport(){
    if(window.visualViewport){
      return { w: window.visualViewport.width, h: window.visualViewport.height };
    }
    return { w: window.innerWidth, h: window.innerHeight };
  }

  function moveForgiveNo(){
    var pad = 20;
    var vp = visibleViewport();
    var w = forgiveNo.offsetWidth;
    var h = forgiveNo.offsetHeight;
    var maxX = Math.max(pad, vp.w - w - pad);
    var maxY = Math.max(pad, vp.h - h - pad);
    var x = pad + Math.random() * (maxX - pad);
    var y = pad + Math.random() * (maxY - pad);

    forgiveNo.style.left = x + "px";
    forgiveNo.style.top = y + "px";
  }

  function dodgeForgiveNo(e){
    if(e && e.cancelable) e.preventDefault();

    if(!forgiveNo.classList.contains("dodging")){
      var rect = forgiveNo.getBoundingClientRect();
      forgiveNo.style.left = rect.left + "px";
      forgiveNo.style.top = rect.top + "px";
      forgiveNo.classList.add("dodging");

      // give the browser a real painted frame at the frozen spot first,
      // otherwise the very first move can skip straight to the end
      // position instead of visibly gliding there
      window.requestAnimationFrame(function(){
        window.requestAnimationFrame(moveForgiveNo);
      });
      return;
    }

    moveForgiveNo();
  }

  forgiveNo.addEventListener("pointerenter", dodgeForgiveNo);
  forgiveNo.addEventListener("touchstart", dodgeForgiveNo, { passive:false });
  forgiveNo.addEventListener("click", dodgeForgiveNo);

  forgiveYes.addEventListener("click", function(){
    if(forgiveBox.classList.contains("answered")) return;
    forgiveBox.classList.add("answered");
    buzz([25, 40, 25]);
    forgiveHearts.classList.remove("burst");
    void forgiveHearts.offsetWidth;
    forgiveHearts.classList.add("burst");
    backLink.classList.add("enabled");

    window.setTimeout(function(){
      notifyBox.classList.add("show");
    }, 600);
  });

  notifyYes.addEventListener("click", function(){
    var url = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent("estaba molesta pero ya te perdoneee 😁");
    window.open(url, "_blank", "noopener");
    notifyBox.classList.remove("show");
  });

  notifyNo.addEventListener("click", function(){
    notifyBox.classList.remove("show");
  });

  function onPetalTap(){
    var petalGroup = this;
    var idx = parseInt(petalGroup.closest("[data-petal]").dataset.petal, 10);

    if(petalGroup.classList.contains("fallen")) return;

    pickCount++;
    fallenCount++;
    var isLast = fallenCount === petalLovesMe.length;
    var loves = pickCount % 2 === 1;

    var label = document.getElementById("petalLabel" + idx);
    var dict = translations[currentLang];
    label.textContent = isLast ? dict.lovesMeFinal : (loves ? dict.lovesMe : dict.lovesMeNot);
    label.classList.toggle("final", isLast);
    label.classList.remove("pop");
    void label.offsetWidth;
    label.classList.add("pop");

    petalGroup.classList.remove("regrowing");
    void petalGroup.offsetWidth;
    petalGroup.classList.add("fallen");

    if(isLast){
      buzz([30, 50, 30, 50, 60]);
      window.setTimeout(function(){
        ["heart0","heart1","heart2"].forEach(function(id, i){
          var h = document.getElementById(id);
          h.classList.remove("burst");
          void h.offsetWidth;
          window.setTimeout(function(){ h.classList.add("burst"); }, i * 120);
        });
      }, 150);

      regrowTimer = window.setTimeout(nextFlower, 3600);
    }
  }

  function resetForNewFlower(){
    lilySvg.querySelectorAll(".petal-fall").forEach(function(p){
      p.classList.remove("fallen", "regrowing");
    });
    lilySvg.querySelectorAll(".petal-label").forEach(function(l){
      l.classList.remove("pop", "final");
    });
    pickCount = 0;
    fallenCount = 0;
  }

  function nextFlower(){
    flowerIndex = (flowerIndex + 1) % lilyPalettes.length;

    if(reduceMotion){
      applyLilyPalette(flowerIndex);
      resetForNewFlower();
      return;
    }

    lilyScene.classList.remove("swaying");
    var lilyPlant = lilySvg.querySelector(".lily-plant");
    lilyPlant.classList.add("flying-away");

    window.setTimeout(function(){
      lilyPlant.classList.remove("flying-away");
      applyLilyPalette(flowerIndex);
      resetForNewFlower();

      lilyScene.classList.remove("drawn");
      void lilyScene.offsetWidth;
      lilyScene.classList.add("drawn");

      window.setTimeout(function(){
        lilyScene.classList.add("swaying");
      }, 1400);
    }, 1100);
  }

})();
</script>

</body>
</html>
